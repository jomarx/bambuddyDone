[platformio]
default_envs = d1_mini

[env]
platform = espressif8266
board = d1_mini
framework = arduino

monitor_speed = 115200
upload_speed = 921600

[env:d1_mini]
lib_deps =
    olikraus/U8g2@^2.35.30
    bblanchon/ArduinoJson@^7.0.4

build_flags =
    -Wall

build_src_filter = +<*> -<diag/>

; Wiring diagnostic: line levels + I2C scan, as wired and swapped.
[env:i2c_diag]
build_src_filter = +<diag/>
